<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BakongAPI-Dev | Updating</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
background:#050505;
color:white;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
overflow:hidden;
}

/* glitch text */

.glitch{
font-size:60px;
color:#00eaff;
position:relative;
animation:glitch 1s infinite;
}

@keyframes glitch{

0%{text-shadow:3px 3px red,-3px -3px cyan;}
25%{text-shadow:-3px 3px red,3px -3px cyan;}
50%{text-shadow:3px -3px red,-3px 3px cyan;}
75%{text-shadow:-3px -3px red,3px 3px cyan;}
100%{text-shadow:3px 3px red,-3px -3px cyan;}

}

/* updating text */

.status{
margin-top:20px;
font-size:20px;
color:#aaa;
animation:blink 1.2s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0.3;}
100%{opacity:1;}
}

/* progress bar */

.progress-box{
margin-top:40px;
width:300px;
height:8px;
background:#111;
border-radius:20px;
overflow:hidden;
}

.progress{
height:100%;
width:0%;
background:#00eaff;
animation:load 6s infinite;
}

@keyframes load{
0%{width:0%;}
50%{width:80%;}
100%{width:100%;}
}

/* floating particles */

span{
position:absolute;
background:#00eaff;
border-radius:50%;
opacity:0.5;
animation:float 10s linear infinite;
}

@keyframes float{

0%{
transform:translateY(100vh) scale(0);
}

100%{
transform:translateY(-10vh) scale(1);
}

}

footer{
position:absolute;
bottom:20px;
font-size:14px;
color:#777;
}

</style>
</head>

<body>

<h1 class="glitch">BAKONGAPI-DEV</h1>

<div class="status">
System Updating...
</div>

<div class="progress-box">
<div class="progress"></div>
</div>

<footer>
© 2026 BakongAPI-Dev
</footer>

<script>

/* create floating particles */

for(let i=0;i<40;i++){

let particle=document.createElement("span");

let size=Math.random()*4+2;

particle.style.width=size+"px";
particle.style.height=size+"px";

particle.style.left=Math.random()*100+"vw";

particle.style.animationDuration=(Math.random()*10+5)+"s";

document.body.appendChild(particle);

}

</script>

</body>
</html>
```
